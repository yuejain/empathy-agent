<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情感共情陪伴Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 { font-size: 24px; margin-bottom: 5px; }
        .header-left p { opacity: 0.9; font-size: 14px; }

        .state-badge {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            backdrop-filter: blur(10px);
        }

        .main-area {
            display: flex;
            height: 550px;
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }

        .message-content {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }

        .input-container {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-wrapper { display: flex; gap: 10px; }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus { border-color: #667eea; }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 右侧信息面板 */
        .info-panel {
            width: 280px;
            background: #fafafa;
            padding: 20px;
            overflow-y: auto;
        }

        .info-section {
            margin-bottom: 20px;
        }

        .info-section h3 {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 2px solid #667eea;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
        }

        .info-label { color: #666; }
        .info-value { color: #333; font-weight: 500; }

        .emotion-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .emotion-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .emotion-positive { background: linear-gradient(90deg, #4CAF50, #8BC34A); }
        .emotion-negative { background: linear-gradient(90deg, #f44336, #FF5722); }
        .emotion-neutral { background: linear-gradient(90deg, #9E9E9E, #BDBDBD); }

        .state-timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .state-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
        }

        .state-dot.active { background: #667eea; box-shadow: 0 0 5px rgba(102, 126, 234, 0.5); }
        .state-dot.visited { background: #9C27B0; }

        .safety-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .safety-low { background: #E8F5E9; color: #2E7D32; }
        .safety-medium { background: #FFF3E0; color: #E65100; }
        .safety-high { background: #FFEBEE; color: #C62828; }

        .status {
            text-align: center;
            padding: 8px;
            color: #999;
            font-size: 13px;
        }

        .safety-warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>情感共情陪伴Agent</h1>
                <p>我在这里倾听，理解你的感受</p>
            </div>
            <div class="state-badge" id="stateBadge">初始化</div>
        </div>

        <div class="main-area">
            <div class="chat-panel">
                <div class="chat-container" id="chatContainer">
                    <div class="message assistant">
                        <div class="message-content">
                            你好！我是你的情感共情陪伴助手。在这里，你可以自由地表达你的感受，我会尽力理解并支持你。今天你想聊些什么？
                        </div>
                    </div>
                </div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <input type="text" id="userInput" placeholder="输入你想说的话..." autocomplete="off">
                        <button id="sendButton" onclick="sendMessage()">发送</button>
                    </div>
                    <div class="status" id="status">准备就绪</div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-section">
                    <h3>情绪状态</h3>
                    <div class="info-item">
                        <span class="info-label">主要情绪</span>
                        <span class="info-value" id="emotionPrimary">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">强度</span>
                        <span class="info-value" id="emotionIntensity">-</span>
                    </div>
                    <div class="emotion-bar">
                        <div class="emotion-bar-fill emotion-neutral" id="emotionBar" style="width: 0%"></div>
                    </div>
                    <div class="info-item" style="margin-top: 8px">
                        <span class="info-label">效价</span>
                        <span class="info-value" id="emotionValence">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">趋势</span>
                        <span class="info-value" id="emotionTrajectory">-</span>
                    </div>
                </div>

                <div class="info-section">
                    <h3>共情状态</h3>
                    <div class="info-item">
                        <span class="info-label">共情层级</span>
                        <span class="info-value" id="empathyLevel">L2</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">策略</span>
                        <span class="info-value" id="empathyStrategy">情绪命名+验证</span>
                    </div>
                </div>

                <div class="info-section">
                    <h3>对话状态</h3>
                    <div class="info-item">
                        <span class="info-label">当前阶段</span>
                        <span class="info-value" id="currentState">初始化</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">轮次</span>
                        <span class="info-value" id="turnCount">0</span>
                    </div>
                    <div class="state-timeline" id="stateTimeline"></div>
                </div>

                <div class="info-section">
                    <h3>安全状态</h3>
                    <div class="info-item">
                        <span class="info-label">风险等级</span>
                        <span class="safety-badge safety-low" id="safetyLevel">低</span>
                    </div>
                </div>

                <div class="info-section">
                    <h3>系统信息</h3>
                    <div class="info-item">
                        <span class="info-label">处理时间</span>
                        <span class="info-value" id="processingTime">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">记忆使用</span>
                        <span class="info-value" id="memoryUsed">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 会话管理
        let turnCount = 0;
        let stateHistory = [];

        function getOrCreateConversationId() {
            let id = localStorage.getItem('empathy-agent-conversation-id');
            if (!id) {
                id = 'conv-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('empathy-agent-conversation-id', id);
            }
            return id;
        }

        // 添加消息
        function addMessage(content, isUser = false, data = null) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (!isUser && data) {
                updateInfoPanel(data);
            }
        }

        // 更新信息面板
        function updateInfoPanel(data) {
            // 情绪信息
            if (data.emotion) {
                document.getElementById('emotionPrimary').textContent = data.emotion.primary || '-';
                document.getElementById('emotionIntensity').textContent =
                    data.emotion.intensity ? data.emotion.intensity.toFixed(2) : '-';
                document.getElementById('emotionValence').textContent =
                    data.emotion.valence ? data.emotion.valence.toFixed(2) : '-';
                document.getElementById('emotionTrajectory').textContent =
                    translateTrajectory(data.emotion.trajectory);

                // 更新情绪条
                const bar = document.getElementById('emotionBar');
                const intensity = data.emotion.intensity || 0;
                bar.style.width = `${intensity * 100}%`;
                bar.className = 'emotion-bar-fill ' + (
                    data.emotion.valence > 0.2 ? 'emotion-positive' :
                    data.emotion.valence < -0.2 ? 'emotion-negative' : 'emotion-neutral'
                );
            }

            // 共情信息
            if (data.empathy) {
                document.getElementById('empathyLevel').textContent = data.empathy.level || '-';
                document.getElementById('empathyStrategy').textContent = data.empathy.strategy || '-';
            }

            // 状态信息
            if (data.state) {
                document.getElementById('currentState').textContent = data.state.phase || '-';
                document.getElementById('stateBadge').textContent = data.state.phase || '-';

                // 更新状态时间线
                if (!stateHistory.includes(data.state.current)) {
                    stateHistory.push(data.state.current);
                    updateStateTimeline();
                }
            }

            // 安全信息
            if (data.safety) {
                const safetyEl = document.getElementById('safetyLevel');
                safetyEl.textContent = translateSafetyLevel(data.safety.riskLevel);
                safetyEl.className = 'safety-badge safety-' + (data.safety.riskLevel || 'low');
            }

            // 系统信息
            if (data.memory) {
                document.getElementById('processingTime').textContent =
                    data.memory.processingTimeMs ? `${data.memory.processingTimeMs}ms` : '-';
                document.getElementById('memoryUsed').textContent =
                    data.memory.memoriesUsed !== undefined ? `${data.memory.memoriesUsed}条` : '-';
            }

            // 更新轮次
            turnCount++;
            document.getElementById('turnCount').textContent = turnCount;
        }

        // 更新状态时间线
        function updateStateTimeline() {
            const timeline = document.getElementById('stateTimeline');
            timeline.innerHTML = '';
            stateHistory.forEach((state, i) => {
                const dot = document.createElement('div');
                dot.className = 'state-dot' + (i === stateHistory.length - 1 ? ' active' : ' visited');
                dot.title = state;
                timeline.appendChild(dot);
            });
        }

        // 翻译函数
        function translateTrajectory(t) {
            const map = { 'rising': '上升', 'stable': '稳定', 'declining': '下降', 'fluctuating': '波动' };
            return map[t] || t || '-';
        }

        function translateSafetyLevel(l) {
            const map = { 'low': '低', 'medium': '中', 'high': '高' };
            return map[l] || l || '低';
        }

        // 添加安全警告
        function addSafetyWarning(message) {
            const chatContainer = document.getElementById('chatContainer');
            const warningDiv = document.createElement('div');
            warningDiv.className = 'safety-warning';
            warningDiv.textContent = '⚠️ ' + message;
            chatContainer.appendChild(warningDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 发送消息
        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const status = document.getElementById('status');
            const message = userInput.value.trim();

            if (!message) return;

            userInput.disabled = true;
            sendButton.disabled = true;
            status.innerHTML = '<span class="loading-spinner"></span>正在思考...';

            addMessage(message, true);
            userInput.value = '';

            try {
                const conversationId = getOrCreateConversationId();

                const response = await fetch('/empathy-agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'makers-conversation-id': conversationId
                    },
                    body: JSON.stringify({ message, userInput: message })
                });

                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let assistantMessage = '';
                let responseData = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;

                        try {
                            const event = JSON.parse(data);

                            if (event.type === 'ai_response' && event.content && event.emotion) {
                                assistantMessage = event.content;
                                responseData = event;

                                if (event.safety && !event.safety.isSafe) {
                                    addSafetyWarning('检测到潜在风险，已启动安全协议');
                                }
                            } else if (event.type === 'ai_response') {
                                assistantMessage += event.content || '';
                            } else if (event.type === 'error_message') {
                                addMessage(`错误：${event.content}`, false);
                            }
                        } catch (e) {
                            if (data && data !== '[DONE]') {
                                assistantMessage += data;
                            }
                        }
                    }
                }

                if (assistantMessage) {
                    addMessage(assistantMessage, false, responseData);
                }

            } catch (error) {
                console.error('Error:', error);
                addMessage('抱歉，发生了错误。请稍后再试。', false);
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                status.textContent = '准备就绪';
                userInput.focus();
            }
        }

        // 回车发送
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // 初始焦点
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
